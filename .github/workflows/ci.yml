name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # TypeScript/renderer regression checks must not be blocked by the
      # cx_Freeze/patchelf agent packaging step (tested by release workflows).
      - run: npm run build:app
      - run: npm run typecheck
      - name: Verify platform-specific Legendary packaging
        run: node --test scripts/test-platform-tools.js
      - name: Install integrity regression tests
        run: node --test scripts/test-install-finalization.js
      - name: Save backup integrity regression tests
        run: node --test scripts/test-backup-integrity.js
      - name: Cloud save conflict policy
        run: node --test scripts/test-save-sync-policy.js
      - name: Complete cloud save bundles
        run: node --test scripts/test-save-bundles.js
      - name: Nested game save directory round trip
        run: node --test scripts/test-nested-saves.js

  windows-smoke:
    name: Windows app + toast compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:app
      - run: npm run typecheck
      - name: Verify Windows Legendary exclusion
        run: node --test scripts/test-platform-tools.js
      - name: Check Legendary fetch is a no-op on Windows
        run: node scripts/fetch-legendary.js
      - run: node --test scripts/test-install-finalization.js scripts/test-backup-integrity.js scripts/test-save-sync-policy.js scripts/test-save-bundles.js scripts/test-nested-saves.js
      - name: Compile native Windows toast (verifies border fix)
        run: npm run build:notification-overlay:windows
